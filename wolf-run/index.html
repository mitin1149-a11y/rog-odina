<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Волчий забег</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen night arcade — title strip, the forest stage, the clap console underneath */
:root{
  --night:#0b1020; --panel:#131a31; --line:#28335a;
  --moon:#f4e7b8; --fang:#e9eef7; --muted:#8e98bb;
  --amber:#ffb84d; --danger:#ff5e6e; --leaf:#5fd39a;
  --f-display:'Russo One','Arial Black',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--fang);font-family:var(--f-body);font-size:15px;overflow-x:hidden}
.app{height:100%;min-height:520px;display:flex;flex-direction:column;gap:10px;max-width:1400px;margin:0 auto;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(1.2rem,2.6vw,1.7rem);letter-spacing:.04em;color:var(--moon)}
.brand small{font-family:var(--f-body);font-weight:700;font-size:.8rem;color:var(--muted);letter-spacing:.02em;margin-left:10px}
.hdr-btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.ghost{background:var(--panel);color:var(--fang);border:1px solid var(--line);padding:6px 12px;font-weight:700;font-size:.85rem}
.ghost:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

#stage{position:relative;flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#game{display:block;border-radius:14px;background:var(--night);box-shadow:0 0 0 1px var(--line)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.card{background:color-mix(in srgb,var(--night) 86%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;
  padding:clamp(14px,3vw,26px);max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.card .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:800;color:var(--amber)}
.card h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4.4vw,2.6rem);line-height:1.05;color:var(--moon);text-wrap:balance}
.card p{color:#c9d0e6;line-height:1.45}
.cmds{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px;padding:0;margin:0}
.cmds li{display:flex;gap:10px;align-items:baseline}
.cmds b{font-family:var(--f-display);font-weight:400;color:var(--amber);min-width:3.2em;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.primary{background:var(--amber);color:#24170a;font-weight:800;padding:11px 20px;font-size:1rem}
.primary:hover{filter:brightness(1.08)}
.secondary{background:transparent;color:var(--fang);border:1px solid var(--line);font-weight:700;padding:10px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border-radius:10px;padding:8px 10px}
.stats span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats strong{font-family:var(--f-display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted)}
.newrec{color:var(--leaf);font-weight:800}

.console{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.5fr);gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
#micBtn{background:var(--amber);color:#24170a;font-weight:800;padding:8px 12px}
#micBtn.on{background:var(--leaf);color:#0b2116}
#micStatus{font-size:.82rem;color:var(--muted);line-height:1.3}
#meter{width:100%;height:38px;display:block;border-radius:6px;background:#0d1328}
.sens{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.sens input{flex:1;accent-color:var(--amber);min-width:0}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:#0d1328;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;transition:background .15s,border-color .15s}
.chip b{display:block;font-family:var(--f-display);font-weight:400;color:var(--amber);font-size:1.05rem}
.chip span{font-size:.75rem;color:#c9d0e6}
.chip.fire{background:color-mix(in srgb,var(--amber) 30%,#0d1328);border-color:var(--amber)}
#claps{font-size:.82rem;color:var(--muted);min-height:1.2em}

@media (max-width:820px){
  .console{grid-template-columns:1fr 1fr}
  .console .box:last-child{grid-column:1/-1}
  .brand small{display:none}
}
@media (max-width:480px){
  .console{grid-template-columns:1fr}
  .app{min-height:640px}
}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}
</style>

<div class="app">
  <header>
    <div class="brand">ВОЛЧИЙ ЗАБЕГ<small>игра на хлопках</small></div>
    <div class="hdr-btns">
      <button class="ghost" id="soundBtn" type="button">Звук: вкл</button>
      <button class="ghost" id="pauseBtn" type="button">Пауза</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="game" aria-label="Игровое поле: волк бежит по ночному лесу"></canvas>
    <div class="overlay" id="ov"></div>
  </div>

  <div class="console">
    <div class="box">
      <h3>Микрофон</h3>
      <button id="micBtn" type="button">Включить микрофон</button>
      <div id="micStatus">Без микрофона хлопок заменяет пробел или касание поля.</div>
    </div>
    <div class="box">
      <h3>Громкость и порог</h3>
      <canvas id="meter" aria-label="Индикатор громкости"></canvas>
      <label class="sens" for="sens">Чувствительность <input id="sens" type="range" min="5" max="95" value="60"><output id="sensVal">60</output></label>
    </div>
    <div class="box">
      <h3>Команды · серия заканчивается после 0,33 с тишины</h3>
      <div class="chips">
        <div class="chip" data-n="1"><b>👏</b><span>прыжок</span></div>
        <div class="chip" data-n="2"><b>👏×2</b><span>пригнуться</span></div>
        <div class="chip" data-n="3"><b>👏×3</b><span>пауза</span></div>
        <div class="chip" data-n="4"><b>👏×4</b><span>вой</span></div>
      </div>
      <div id="claps">Хлопков в серии: 0</div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ---------- canvas & sizing ---------- */
var cv=document.getElementById('game'), cx=cv.getContext('2d');
var stage=document.getElementById('stage');
var H=400, W=900, scale=1;
function resize(){
  var r=stage.getBoundingClientRect();
  var a=r.width/Math.max(r.height,1); a=Math.min(2.8,Math.max(1.6,a));
  W=Math.round(H*a);
  var cw=r.width, ch=cw/a; if(ch>r.height){ch=r.height;cw=ch*a}
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  cv.width=Math.max(1,Math.round(cw*dpr)); cv.height=Math.max(1,Math.round(ch*dpr));
  scale=cv.width/W;
  var m=document.getElementById('meter'); var mr=m.getBoundingClientRect();
  m.width=Math.max(1,Math.round(mr.width*dpr)); m.height=Math.max(1,Math.round(mr.height*dpr));
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else addEventListener('resize',resize);
resize();

/* ---------- helpers ---------- */
function rand(a,b){return a+Math.random()*(b-a)}
function hash(i){var s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

/* ---------- sound ---------- */
var ac=null, muted=false;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f1,f2,dur,type,vol,delay){
  if(!ac||muted)return;
  var t0=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
  g.gain.setValueAtTime(vol||0.06,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol){
  if(!ac||muted)return;
  var n=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  var s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; g.gain.value=vol||0.15;
  s.connect(g); g.connect(ac.destination); s.start();
}
function howlSound(){
  if(!ac||muted)return;
  var t0=ac.currentTime, o=ac.createOscillator(), lfo=ac.createOscillator(), lg=ac.createGain(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(260,t0); o.frequency.linearRampToValueAtTime(560,t0+0.45);
  o.frequency.linearRampToValueAtTime(520,t0+1.1); o.frequency.linearRampToValueAtTime(330,t0+1.6);
  lfo.frequency.value=6; lg.gain.value=12; lfo.connect(lg); lg.connect(o.frequency);
  f.type='lowpass'; f.frequency.value=1400; f.Q.value=4;
  g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(0.12,t0+0.2); g.gain.linearRampToValueAtTime(0.0001,t0+1.7);
  o.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(t0); lfo.start(t0); o.stop(t0+1.75); lfo.stop(t0+1.75);
}
var sfx={
  jump:function(){tone(320,640,0.14,'square',0.05)},
  jump2:function(){tone(480,900,0.14,'square',0.05)},
  duck:function(){tone(300,140,0.12,'triangle',0.08)},
  bone:function(){tone(880,1320,0.08,'square',0.04);tone(1320,1760,0.08,'square',0.035,0.06)},
  star:function(){tone(660,1980,0.3,'sine',0.08)},
  shield:function(){tone(440,880,0.2,'triangle',0.08);tone(660,1320,0.25,'triangle',0.06,0.1)},
  hit:function(){noise(0.25,0.22);tone(200,60,0.3,'sawtooth',0.07)},
  block:function(){tone(1200,300,0.2,'triangle',0.08)},
  pause:function(){tone(520,520,0.08,'sine',0.06);tone(390,390,0.12,'sine',0.06,0.09)},
  over:function(){tone(440,110,0.9,'sawtooth',0.07)},
  level:function(){tone(523,523,0.1,'triangle',0.06);tone(659,659,0.1,'triangle',0.06,0.1);tone(784,784,0.18,'triangle',0.06,0.2)}
};
document.getElementById('soundBtn').onclick=function(){muted=!muted;this.textContent='Звук: '+(muted?'выкл':'вкл')};

/* ---------- world constants ---------- */
var G=332, GRAV=2500;
var ZONES=['Опушка','Тёмный бор','Болото светлячков','Старая просека','Лунные скалы','Сердце леса','Волчья тропа'];
var best=parseInt(store('wolf-run-best')||'0',10)||0;

var overAt=0, state='menu', wolf, obs, items, parts, floats, waves, speed, score, bones, combo, lives, howl, shield, t, spawnT, itemT, zone, shake, invul, bgX, banner;
function reset(){
  wolf={x:120,y:G,vy:0,duck:0,jumps:0,run:0,howlT:0};
  obs=[];items=[];parts=[];floats=[];waves=[];
  speed=360;score=0;bones=0;combo=0;lives=3;howl=0;shield=0;t=0;spawnT=1.4;itemT=0.7;zone=0;shake=0;invul=0;
  banner={text:ZONES[0],life:2.2};
}
reset(); bgX=0;

/* ---------- background decor ---------- */
var stars=[];for(var i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*0.62,r:Math.random()*1.4+0.3,p:Math.random()*6});
var flies=[];for(i=0;i<14;i++)flies.push({x:Math.random()*1400,y:rand(180,320),p:Math.random()*6});

/* ---------- wolf actions ---------- */
function wolfBox(){
  var d=wolf.duck>0&&wolf.y>=G-2;
  var w=d?74:62, h=d?24:42;
  return {x:wolf.x-w/2+6,y:wolf.y-h,w:w-12,h:h-4};
}
function jump(){
  if(state!=='play')return;
  if(wolf.jumps>=2)return;
  wolf.vy=wolf.jumps===0?-840:-730; wolf.jumps++; wolf.duck=0;
  (wolf.jumps===1?sfx.jump:sfx.jump2)();
  dust(wolf.x-10,wolf.y,8,'#5b6a98');
}
function duck(){
  if(state!=='play')return;
  wolf.duck=0.95; if(wolf.y<G)wolf.vy=Math.max(wolf.vy,520);
  sfx.duck();
}
function doHowl(){
  if(state!=='play')return;
  if(howl<1){addFloat(wolf.x,wolf.y-70,'Вой ещё не заряжен','#8e98bb');tone(200,180,0.15,'sine',0.05);return}
  howl=0; wolf.howlT=1.4; waves.push({x:wolf.x+20,y:wolf.y-34,r:10});
  howlSound(); shake=8;
  var n=0;
  obs.forEach(function(o){ if(o.x<W+20&&!o.dead){o.dead=true;n++;burst(o.x+o.w/2,o.y+o.h/2,18,o.fly?'#c3a3ff':'#d9b48a')} });
  if(n){score+=25*n;addFloat(W/2,150,'+'+(25*n)+' за разогнанных','#f4e7b8')}
  addFloat(wolf.x+40,wolf.y-90,'АУУУУУ!','#f4e7b8',1.6,30);
}
function togglePause(){
  if(state==='play'){state='pause';sfx.pause();showOverlay()}
  else if(state==='pause'){state='play';sfx.pause();hideOverlay();last=performance.now()}
}
function start(){
  audio(); reset(); state='play'; hideOverlay(); last=performance.now();
}

/* ---------- spawning ---------- */
var GROUND_TYPES=[{k:'stump',w:36,h:44},{k:'rock',w:52,h:30},{k:'log',w:88,h:30},{k:'thorns',w:58,h:46}];
function spawnObstacle(){
  var batP=t<8?0:Math.min(0.45,0.16+zone*0.06);
  if(Math.random()<batP){
    obs.push({k:'bat',fly:true,x:W+40,y:G-30-24,w:42,h:24,ph:Math.random()*6,base:G-30-24});
  }else{
    var g=GROUND_TYPES[Math.floor(Math.random()*GROUND_TYPES.length)];
    obs.push({k:g.k,x:W+40,y:G-g.h,w:g.w,h:g.h});
    if(zone>=2&&Math.random()<0.22){ /* twin stumps: needs a higher jump */
      obs.push({k:'stump',x:W+40+g.w+10,y:G-56,w:34,h:56});
    }
  }
}
function spawnItems(){
  var r=Math.random(), x=W+60;
  if(t>25&&!shield&&r<0.05){items.push({k:'shield',x:x,y:G-120,r:14});return}
  if(r<0.2){items.push({k:'star',x:x,y:G-rand(120,170),r:12});return}
  if(r<0.55){ /* arc of bones over the next jump */
    for(var i=0;i<5;i++)items.push({k:'bone',x:x+i*34,y:G-40-Math.sin(i/4*Math.PI)*100,r:11});
  }else{
    var n=3+Math.floor(Math.random()*3);
    for(i=0;i<n;i++)items.push({k:'bone',x:x+i*32,y:G-26,r:11});
  }
}

/* ---------- effects ---------- */
function burst(x,y,n,c){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=rand(80,320);parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:rand(0.4,0.9),max:0.9,c:c,s:rand(2,5),g:600})}}
function dust(x,y,n,c){for(var i=0;i<n;i++)parts.push({x:x+rand(-8,8),y:y-2,vx:rand(-120,-30),vy:rand(-90,-20),life:rand(0.25,0.5),max:0.5,c:c,s:rand(2,4),g:200})}
function addFloat(x,y,text,c,life,size){floats.push({x:x,y:y,text:text,c:c,life:life||1,max:life||1,size:size||16})}

function hit(){
  if(invul>0)return;
  if(shield){shield=0;invul=1;sfx.block();burst(wolf.x,wolf.y-24,20,'#f4e7b8');addFloat(wolf.x,wolf.y-70,'Щит спас!','#f4e7b8');return}
  lives--;combo=0;invul=1.7;shake=14;sfx.hit();burst(wolf.x,wolf.y-24,16,'#ff5e6e');
  if(lives<=0)gameOver();
}
function gameOver(){
  state='over';overAt=performance.now();sfx.over();
  var rec=false; var s=Math.floor(score);
  if(s>best){best=s;rec=true;store('wolf-run-best',String(best))}
  showOverlay(rec);
}

/* ---------- update ---------- */
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){
  t+=dt; speed=Math.min(940,360+t*8.5);
  var mv=speed*dt; bgX+=mv;
  score+=mv/22;

  var z=Math.floor(score/600);
  if(z>zone){zone=z;banner={text:ZONES[Math.min(z,ZONES.length-1)]+(z>=ZONES.length?' '+(z-ZONES.length+2):''),life:2.4};sfx.level();lives=Math.min(5,lives+(z%2===0?1:0))}

  if(wolf.duck>0)wolf.duck-=dt;
  wolf.vy+=GRAV*dt; wolf.y+=wolf.vy*dt;
  if(wolf.y>=G){if(wolf.jumps>0)dust(wolf.x-6,G,5,'#5b6a98');wolf.y=G;wolf.vy=0;wolf.jumps=0}
  wolf.run+=dt*speed/38;
  if(wolf.howlT>0)wolf.howlT-=dt;
  if(invul>0)invul-=dt;
  if(shake>0)shake=Math.max(0,shake-dt*40);

  spawnT-=dt;
  if(spawnT<=0){spawnObstacle();spawnT=rand(1.05,1.9)*Math.max(0.72,1-t/300)}
  itemT-=dt;
  if(itemT<=0){spawnItems();itemT=rand(1.6,3.2)}

  var wb=wolfBox();
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i]; o.x-=mv;
    if(o.fly){o.ph+=dt*12;o.y=o.base-Math.abs(Math.sin(o.ph*0.25))*6}
    if(!o.dead&&overlap(wb,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-6})){o.dead=true;hit();}
    if(o.x+o.w<-60)obs.splice(i,1); else if(o.dead&&state==='play'&&o.fade===undefined)o.fade=0.35;
    if(o.fade!==undefined){o.fade-=dt;if(o.fade<=0)obs.splice(i,1)}
  }
  for(i=items.length-1;i>=0;i--){
    var it=items[i]; it.x-=mv;
    var cxp=Math.max(wb.x,Math.min(it.x,wb.x+wb.w)), cyp=Math.max(wb.y,Math.min(it.y,wb.y+wb.h));
    if((it.x-cxp)*(it.x-cxp)+(it.y-cyp)*(it.y-cyp)<it.r*it.r+60){
      items.splice(i,1);
      if(it.k==='bone'){combo=Math.min(combo+1,40);var m=1+Math.floor(combo/5);bones++;score+=5*m;sfx.bone();burst(it.x,it.y,6,'#f4e7b8');if(combo%5===0)addFloat(it.x,it.y-20,'комбо ×'+m,'#ffb84d')}
      else if(it.k==='star'){howl=Math.min(1,howl+0.34);sfx.star();burst(it.x,it.y,12,'#c3a3ff');addFloat(it.x,it.y-20,howl>=1?'Вой готов! 👏×4':'+ лунный осколок','#c3a3ff')}
      else if(it.k==='shield'){shield=1;sfx.shield();addFloat(it.x,it.y-20,'Лунный щит','#f4e7b8')}
      continue;
    }
    if(it.x<-40)items.splice(i,1);
  }
  stepEffects(dt);
}
function stepEffects(dt){
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.life<=0)parts.splice(i,1)}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1)}
  for(i=waves.length-1;i>=0;i--){waves[i].r+=900*dt;if(waves[i].r>W*1.3)waves.splice(i,1)}
  if(banner&&banner.life>0)banner.life-=dt;
}

function pines(spacing,factor,minH,varH,color,seed){

    cx.fillStyle='#ff5e6e';[[0.3,0.4],[0.65,0.3],[0.5,0.7]].forEach(function(b){cx.beginPath();cx.arc(x+w*b[0],y+h*b[1],3,0,7);cx.fill()});
  }else if(o.k==='bat'){

    cx.beginPath();cx.moveTo(mx,my);cx.quadraticCurveTo(mx+14,my-14-f,mx+24,my-4-f);cx.lineTo(mx+16,my+2);cx.lineTo(mx+20,my+6);cx.lineTo(mx+8,my+4);cx.fill();
    cx.fillStyle='#3a2f5a';cx.beginPath();cx.ellipse(mx,my+2,8,9,0,0,7);cx.fill();
    cx.beginPath();cx.moveTo(mx-6,my-4);cx.lineTo(mx-5,my-12);cx.lineTo(mx-2,my-6);cx.moveTo(mx+6,my-4);cx.lineTo(mx+5,my-12);cx.lineTo(mx+2,my-6);cx.fill();
    cx.fillStyle='#ff5e6e';cx.fillRect(mx-4,my-1,2.5,2.5);cx.fillRect(mx+1.5,my-1,2.5,2.5);
    cx.strokeStyle='rgba(195,163,255,.25)';cx.setLineDash([3,5]);cx.beginPath();cx.moveTo(mx,0);cx.lineTo(mx,y-6);cx.stroke();cx.setLineDash([]);

function heart(x,y,full){

function render(time){

  parts.forEach(function(p){cx.globalAlpha=Math.max(0,p.life/p.max);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});cx.globalAlpha=1;
  floats.forEach(function(f){cx.globalAlpha=Math.max(0,f.life/f.max);cx.fillStyle=f.c;cx.textAlign='center';cx.textBaseline='middle';cx.font=(f.size>20?f.size+'px "Russo One", sans-serif':'800 '+f.size+'px Nunito, sans-serif');cx.fillText(f.text,f.x,f.y)});cx.globalAlpha=1;
  cx.restore();

/* ---------- microphone & clap detection ---------- */
var analyser=null, buf=null, level=0, bgLevel=0.01, lastClap=0, hist=[];
var sensEl=document.getElementById('sens'), sensVal=document.getElementById('sensVal');
var savedSens=store('wolf-run-sens'); if(savedSens)sensEl.value=savedSens; sensVal.textContent=sensEl.value;
sensEl.oninput=function(){sensVal.textContent=sensEl.value;store('wolf-run-sens',sensEl.value)};
function threshold(){return 0.95-sensEl.value*0.0095}
var micBtn=document.getElementById('micBtn'), micStatus=document.getElementById('micStatus');
function enableMic(){
  audio();
  if(analyser)return;
  if(!ac||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micFail();return}
  micStatus.textContent='Спрашиваем разрешение…';
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
    var src=ac.createMediaStreamSource(st);
    analyser=ac.createAnalyser();analyser.fftSize=1024;src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    micBtn.textContent='Микрофон слушает';micBtn.classList.add('on');
    micStatus.textContent='Хлопните разок: столбик должен перескочить жёлтую линию. Если нет, прибавьте чувствительность.';
  }).catch(function(){micFail()});
}
function micFail(){
  micStatus.textContent='Микрофон здесь недоступен (нужен https или localhost и разрешение). Хлопок заменяют пробел и касание поля.';
  micBtn.textContent='Повторить';
}
micBtn.onclick=enableMic;
function listen(now){
  if(!analyser){level*=0.9;return}
  analyser.getFloatTimeDomainData(buf);
  var pk=0;for(var i=0;i<buf.length;i++){var v=Math.abs(buf[i]);if(v>pk)pk=v}
  level=pk;
  var thr=threshold();
  if(pk>thr&&pk>bgLevel*3.2&&now-lastClap>120){lastClap=now;clap()}
  bgLevel=bgLevel*0.97+Math.min(pk,thr*0.6)*0.03;
}
var meter=document.getElementById('meter'), mx=meter.getContext('2d');
function drawMeter(){
  hist.push(level);if(hist.length>90)hist.shift();
  var w=meter.width,h=meter.height;mx.clearRect(0,0,w,h);
  var bw=w/90;
  for(var i=0;i<hist.length;i++){var v=Math.min(1,hist[i]);mx.fillStyle=v>threshold()?'#ffb84d':'#3d4a80';mx.fillRect(i*bw,h-v*h,Math.max(1,bw-1),v*h)}
  var ty=h-threshold()*h;mx.fillStyle='#ffb84d';mx.fillRect(0,ty,w,Math.max(1,h/30));
}

/* ---------- clap series → command ---------- */
var series=0, seriesTimer=null, SERIES_GAP=330;
var clapsEl=document.getElementById('claps');
function clap(){
  audio();
  series++;clapsEl.textContent='Хлопков в серии: '+series;
  if(analyser)level=Math.max(level,1);
  clearTimeout(seriesTimer);
  seriesTimer=setTimeout(function(){var n=series;series=0;clapsEl.textContent='Последняя команда: '+n+' '+word(n);command(n)},SERIES_GAP);
}
function word(n){return n===1?'хлопок':(n<5?'хлопка':'хлопков')}
function flash(n){
  var c=document.querySelector('.chip[data-n="'+Math.min(4,n)+'"]');if(!c)return;
  c.classList.add('fire');setTimeout(function(){c.classList.remove('fire')},350);
}
function command(n){
  flash(n);
  if(state==='menu'||(state==='over'&&performance.now()-overAt>900)){start();return}
  if(state==='over')return;
  if(state==='pause'){if(n===3)togglePause();return}
  if(n===1)jump();else if(n===2)duck();else if(n===3)togglePause();else doHowl();
}

/* ---------- input ---------- */
addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT'&&e.key!==' ')return;
  var k=e.key;
  if(k===' '){e.preventDefault();if(!e.repeat)clap();return}
  if(e.repeat)return;
  if(k==='ArrowUp'||k==='w'||k==='W'||k==='ц'||k==='Ц'){e.preventDefault();if(state==='play')jump();else if(state!=='pause')start()}
  else if(k==='ArrowDown'||k==='s'||k==='S'||k==='ы'||k==='Ы'){e.preventDefault();duck()}
  else if(k==='p'||k==='P'||k==='з'||k==='З'||k==='Escape'){togglePause()}
  else if(k==='h'||k==='H'||k==='р'||k==='Р'){doHowl()}
  else if(k==='Enter'&&(state==='menu'||state==='over')){start()}
});
stage.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;clap()});
document.getElementById('pauseBtn').onclick=function(){if(state==='play'||state==='pause')togglePause()};

/* ---------- overlay ---------- */
var ov=document.getElementById('ov');
var CMDS='<ul class="cmds"><li><b>👏</b>прыжок, в воздухе ещё раз: двойной</li><li><b>👏👏</b>пригнуться под летучей мышью</li><li><b>👏×3</b>пауза и продолжение</li><li><b>👏×4</b>вой: сметает всё на экране</li></ul>';
function showOverlay(rec){
  var h='';
  if(state==='menu'){
    h='<div class="card"><p class="eyebrow">Ночной лес · управление хлопками</p><h1>Волчий забег</h1>'+
      '<p>Волк мчится через ночной лес. Перепрыгивайте пни, камни, брёвна и колючки, пригибайтесь под летучими мышами. Собирайте косточки ради комбо и лунные осколки: три осколка заряжают вой.</p>'+CMDS+
      '<div class="btns"><button class="primary" id="goBtn" type="button">Начать забег</button><button class="secondary" id="micBtn2" type="button">Включить микрофон</button></div>'+
      '<p class="note">Без микрофона: пробел или касание поля работают как хлопок. Стрелки ↑ ↓, H — вой, P — пауза.</p></div>';
  }else if(state==='pause'){
    h='<div class="card"><p class="eyebrow">Пауза</p><h1>Волк переводит дух</h1><p>Хлопните три раза или нажмите P, чтобы бежать дальше.</p>'+CMDS+
      '<div class="btns"><button class="primary" id="resBtn" type="button">Продолжить</button></div></div>';
  }else{
    var s=Math.floor(score);
    h='<div class="card"><p class="eyebrow">Забег окончен</p><h1>'+(rec?'Новый рекорд!':'Волк устал')+'</h1>'+
      '<div class="stats"><div><span>Очки</span><strong>'+s+'</strong></div><div><span>Косточки</span><strong>'+bones+'</strong></div><div><span>Зона</span><strong>'+(zone+1)+'</strong></div></div>'+
      '<p>'+(rec?'<span class="newrec">Лучший результат на этом устройстве.</span> ':'Рекорд: '+best+'. ')+'Один хлопок, чтобы начать заново.</p>'+
      '<div class="btns"><button class="primary" id="goBtn" type="button">Ещё раз</button></div></div>';
  }
  ov.innerHTML=h;ov.hidden=false;
  var g=document.getElementById('goBtn');if(g){g.onclick=start;g.focus({preventScroll:true})}
  var r=document.getElementById('resBtn');if(r){r.onclick=togglePause;r.focus({preventScroll:true})}
  var m=document.getElementById('micBtn2');if(m)m.onclick=function(){enableMic();m.textContent='Микрофон: см. панель ниже'};
}
function hideOverlay(){ov.hidden=true;ov.innerHTML=''}
showOverlay();

/* ---------- main loop ---------- */
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  listen(now);
  if(state==='play')update(dt);else if(state==='over'){stepEffects(dt)}
  else if(state==='menu'){bgX+=120*dt}
  render(now);drawMeter();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
